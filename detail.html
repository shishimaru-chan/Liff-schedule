
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定確認</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-view.css">
  <script src="script-view.js" defer></script
</head>
<body>
  <!-- カレンダー -->
  <div class="calendar">
    <div class="calendar-header">
      <button id="prevMonth">◀︎</button>
      <span id="currentMonth"></span>
      <button id="nextMonth">▶︎</button>
    </div>

    <div class="weekdays">
      <div>月</div><div>火</div><div>水</div>
      <div>木</div><div>金</div><div>土</div><div>日</div>
    </div>

    <div class="dates" id="calendarDays"></div>
  </div>
  
  <!-- 選択日の予定 -->
  <div id="scheduleList" style="
    margin-top: 16px;
    background: #transparent;
    border-radius: 16px;
    padding: 12px;
    min-height: 60px;
    font-size: 14px;
    ">
    日付をタップすると予定が表示されます
  </div>
  
</body>
</html>
