<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定確認</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --dark-blue: #1A0089;
      --orange: #FF5E33;
      --cream: #EFE7D3;
      --green: #B7CF4F;
      --gray: #999;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--dark-blue);
    }

    .calendar {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .weekdays,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays div {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .dates div {
      position: relative;
      padding: 8px 0;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .dates div:hover {
      background: rgba(0,0,0,0.04);
    }

    .dates .selected {
      background: var(--orange);
      color: #fff;
    }

    /* 🧀🐾 用（次STEPで使う） */
    .dates .mark {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- カレンダー -->
  <div class="calendar">
    <div class="calendar-header">
      <button id="prevMonth">◀︎</button>
      <span id="currentMonth"></span>
      <button id="nextMonth">▶︎</button>
    </div>

    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div>
      <div>水</div><div>木</div><div>金</div><div>土</div>
    </div>

    <div class="dates" id="calendarDays"></div>
  </div>

  <script>
    // ▼▼▼ GASのURL（GET用） ▼▼▼
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwH-YC-D7Rl2p1Vs7S2dsjWTVTwR3AaKxJikFQI_c5Nfn4slF5G_Q3xU5eSRv7rjOKB9w/exec";

    let schedules = [];   // ← 全予定を入れる
    let scheduleMap = {};
    let currentDate = new Date();

    const monthLabel = document.getElementById("currentMonth");
    const calendarDays = document.getElementById("calendarDays");

    // ① GASから予定を取得

    fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
         schedules = data;
         scheduleMap = groupSchedulesByDate(data);

         console.log("予定一覧", schedules);
         console.log("日付マップ", scheduleMap);

         renderCalendar();
        })
        .catch(err => {
          console.error("取得エラー😢", err);
        }); 

      // 日付ごとに予定をまとめる
     function groupSchedulesByDate(data) {
         const map = {};

          data.forEach(item => {
            if (!map[item.date]) {
                 map[item.date] = [];
                }
                map[item.date].push(item.owner);
            });
  
           return map;
        }

      // owner → マーク対応表
      const OWNER_MARK = {
         me: "🧀",
         both: "🐾"
        };
      
      // ② カレンダー描画
      function renderCalendar() {
      calendarDays.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthLabel.textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 空白
      for (let i = 0; i < firstDay; i++) {
        calendarDays.appendChild(document.createElement("div"));
      }

      // 日付
      for (let day = 1; day <= lastDate; day++) {
         const dateEl = document.createElement("div");
         dateEl.textContent = day;

         const mm = String(month + 1).padStart(2, "0");
         const dd = String(day).padStart(2, "0");
         const dateKey = `${year}-${mm}-${dd}`;


         // ★ この日付に予定があるか？
         if (scheduleMap[dateKey]) {
             const markEl = document.createElement("div");
             markEl.className = "mark";

              // 重複しないように unique 化
              const owners = [...new Set(scheduleMap[dateKey])];

              markEl.textContent = owners
                .map(owner => OWNER_MARK[owner] || "")
                .join("");

              dateEl.appendChild(markEl);
            }

         dateEl.addEventListener("click", () => {
             document
              .querySelectorAll(".dates div")
              .forEach(el => el.classList.remove("selected"));

             dateEl.classList.add("selected");

             console.log("選択した日付:", dateKey);
            });
           calendarDays.appendChild(dateEl);
        }
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
  </script>

</body>
</html>
