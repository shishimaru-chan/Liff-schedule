<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

  <style>
/* =========================
   基本設定
========================= */
:root {
  --dark-blue: #1A0089;
  --orange: #FF5E33;
  --cream: #EFE7D3;
  --green: #B7CF4F;
  --gray: #999;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--cream);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", "Segoe UI", sans-serif;
  color: var(--dark-blue);
}

/* =========================
   見出し
========================= */
h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 24px 0 8px;
}

/* =========================
   カレンダー
========================= */
.calendar {
  background: #fff;
  border-radius: 18px;
  padding: 14px;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 10px;
}

.calendar-header span {
  cursor: pointer;
  user-select: none;
}

.weekdays,
.dates {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}

.weekdays div {
  font-size: 11px;
  color: var(--gray);
  margin-bottom: 4px;
}

.dates div {
  position: relative;
  padding: 8px 0;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

.dates div:hover {
  background: rgba(0,0,0,0.04);
}

.dates .selected {
  background: var(--orange);
  color: #fff;
}

.dates .today {
  border: 1.5px solid var(--green);
}

/* マーク用（後でJSから追加される想定） */
.dates .mark {
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
}

/* =========================
   ラジオ（予定の種類）
========================= */
.radio-group {
  display: flex;
  gap: 16px;
  margin-top: 8px;
}

.radio-group label {
  font-size: 14px;
  cursor: pointer;
}

/* =========================
   ボタン系（時間・カテゴリ）
========================= */
.button-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  border: 1px solid var(--dark-blue);
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}

.btn:hover {
  background: rgba(0,0,0,0.04);
}

.btn.selected {
  background: var(--green);
  border-color: var(--green);
  color: var(--dark-blue);
}

/* =========================
   メモ
========================= */
textarea {
  width: 100%;
  border-radius: 14px;
  border: none;
  padding: 12px;
  font-size: 14px;
  resize: none;
}

/* =========================
   登録ボタン（最重要）
========================= */
.submit {
  margin-top: 28px;
  width: 100%;
  padding: 16px;
  border-radius: 18px;
  border: none;
  background: var(--dark-blue);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s ease;
}

.submit:active {
  transform: scale(0.97);
  background: var(--orange);
}
</style>

</head>

<body>

  <!-- カレンダー -->
  <div class="calendar">
    <div class="calendar-header">
      <span>◀</span>
      <div>2025年1月</div>
      <span>▶︎</span>
    </div>

    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div>
      <div>木</div><div>金</div><div>土</div>
    </div>

    <div class="dates">
      <div></div><div></div>
      <div>1</div><div>2</div><div>3</div><div>4</div>
      <div>5</div><div class="today">6</div>
      <div class="selected">7</div><div>8</div><div>9</div><div>10</div>
    </div>
  </div>

  <!-- 予定タイプ -->
  <h2>予定の種類</h2>
  <div class="radio-group">
    <label><input type="radio" checked> 2人の予定</label>
    <label><input type="radio"> 自分の予定</label>
  </div>

  <!-- 時間 -->
  <h2>時間</h2>
  <div class="button-group">
    <div class="btn">朝</div>
    <div class="btn selected">昼</div>
    <div class="btn">夕</div>
    <div class="btn">夜</div>
    <div class="btn">1日</div>
  </div>

  <!-- カテゴリ -->
  <h2>カテゴリ</h2>
  <div class="button-group">
    <div class="btn selected">友達</div>
    <div class="btn">Create</div>
    <div class="btn">Mainte</div>
    <div class="btn">仕事</div>
    <div class="btn">デート</div>
    <div class="btn">家族</div>
  </div>

  <!-- メモ -->
  <h2>メモ</h2>
  <textarea rows="3" placeholder="メモを入力（100文字以内）"></textarea>

  <!-- 登録 -->
  <button class="submit">登録する</button>

  <script>
  // ▼▼▼ ここにGASのURLを貼る ▼▼▼
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzh5lOpuCs5D5SzRBXx7aOo2ymIf89sY_8HC-Rh_hkQTqOXsk8m_8lVlZR8mF9xGJl62A/exec";
</script>


</body>
</html>
