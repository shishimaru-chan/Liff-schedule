
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定確認</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --dark-blue: #1A0089;
      --orange: #FF5E33;
      --cream: #EFE7D3;
      --green: #B7CF4F;
      --gray: #999;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--dark-blue);
    }

    .calendar {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .weekdays,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays div {
      font-size: 11px;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .dates div {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 56px; /* タップしやすさUP */
      padding: 6px 0;
    }

    /*PCのホバー用（とりあえず不要）
    .actions div:hover {
      background: rgba(0,0,0,0.04);
    }
      */

    .dates .selected {
      background: var(--orange);
      color: #fff;
    }

    /* 🧀🐾 用（次STEPで使う） */
    .dates .mark {
      .mark {
      margin-top: 4px;
      font-size: 12px;
    }

    }

    .schedule-card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #eee;
    }

    .schedule-owner {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .schedule-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .schedule-line .memo {
      font-size: 14px;
    }


    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #EFE7D3;
    }

    .memo {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 12px;
      font-size: 12px;
    }

    .actions button {
      border: none;
      background: #1A0089;
      color: #EFE7D3;
      cursor: pointer;
    }

  </style>
</head>

<body>

  <!-- カレンダー -->
  <div class="calendar">
    <div class="calendar-header">
      <button id="prevMonth">◀︎</button>
      <span id="currentMonth"></span>
      <button id="nextMonth">▶︎</button>
    </div>

    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div>
      <div>水</div><div>木</div><div>金</div><div>土</div>
    </div>

    <div class="dates" id="calendarDays"></div>
  </div>
  
  <!-- 選択日の予定 -->
  <div id="scheduleList" style="
    margin-top: 16px;
    background: #fff;
    border-radius: 16px;
    padding: 12px;
    min-height: 60px;
    font-size: 14px;
    ">
    日付をタップすると予定が表示されます
  </div>

  <script>
    // ▼▼▼ GASのURL（GET用） ▼▼▼
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwzl_H9ya4xv9AI7Fy5IjSAC-Tmi5lNTDWaRjZ3ffMfD553KjJ3DQjdo-F91__SUiuomA/exec"
    let schedules = [];   // ← 全予定を入れる
    let scheduleMap = {};
    let currentDate = new Date();

    const monthLabel = document.getElementById("currentMonth");
    const calendarDays = document.getElementById("calendarDays");

    // ① GASから予定を取得

    fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
         schedules = data;
         scheduleMap = groupSchedulesByDate(data);

         console.log("予定一覧", schedules);
         console.log("日付マップ", scheduleMap);

         renderCalendar();
        })
        .catch(err => {
          console.error("取得エラー😢", err);
        }); 
      
      function showSchedules(dateKey) {
        const listEl = document.getElementById("scheduleList");

        if (!scheduleMap[dateKey]) {
          listEl.innerHTML = "この日の予定はありません";
          return;
        }

        listEl.innerHTML = scheduleMap[dateKey]
          .map((item, index) => {
            const ownerText =
              item.owner === "mai" ? "🧀 舞" :
              item.owner === "takuya" ? "🍆 拓哉" :
              item.owner === "both" ? "🐾 2人" : "";

            // 時間はカンマ区切りなので配列にする
            const times = item.time ? item.time.split(",") : [];

            return `
              <div class="schedule-card">
                <div class="schedule-owner">${ownerText}</div>

                <div class="schedule-line">
                 <div class="tags">
                   ${times.map(t => `<span class="tag">${t}</span>`).join("")}
                   ${item.category ? `<span class="tag">${item.category}</span>` : ""}
                 </div>
    
                 <div class="memo">
                   ${item.memo ? item.memo : "（メモなし）"}
                 </div>

                 <div class="actions">
                   <button onclick="alert('編集は次！')">編集</button>
                   <button class="delete-btn" data-id="${item.id}">
                      削除
                   </button>
                 </div>
               </div>
              </div>
            `;
          })
          .join("");
        }  
        

      // 日付ごとに予定をまとめる
     function groupSchedulesByDate(data) {
         const map = {};

          data.forEach(item => {
            if (!map[item.date]) {
                 map[item.date] = [];
                }
                map[item.date].push(item);
            });
  
           return map;
        }

      // owner → マーク対応表
      const OWNER_MARK = {
         mai: "🧀",
         takuya:"🍆",
         both: "🐾"
        };
      
      // ② カレンダー描画
      function renderCalendar() {
      calendarDays.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthLabel.textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      // 空白
      for (let i = 0; i < firstDay; i++) {
        calendarDays.appendChild(document.createElement("div"));
      }

      // 日付
      for (let day = 1; day <= lastDate; day++) {
         const dateEl = document.createElement("div");
         dateEl.textContent = day;

         const mm = String(month + 1).padStart(2, "0");
         const dd = String(day).padStart(2, "0");
         const dateKey = `${year}-${mm}-${dd}`;


         // ★ この日付に予定があるか？
         if (scheduleMap[dateKey]) {
             const markEl = document.createElement("div");
             markEl.className = "mark";

              // 重複しないように unique 化
              const owners = [
               ...new Set(
                  scheduleMap[dateKey].map(item => item.owner)
                )
              ];

              markEl.textContent = owners
                .map(owner => OWNER_MARK[owner] || "")
                .join("");

              dateEl.appendChild(markEl);
            }

         dateEl.addEventListener("click", () => {
             document
              .querySelectorAll(".dates div")
              .forEach(el => el.classList.remove("selected"));

             dateEl.classList.add("selected");

             console.log("選択した日付:", dateKey);

             showSchedules(dateKey);

            });
           calendarDays.appendChild(dateEl);
        }
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.addEventListener("click", e => {
      if (!e.target.classList.contains("delete-btn")) return;

      const id = e.target.dataset.id;
      
      fetch(GAS_URL, {
       method: "POST",
       body: JSON.stringify({
         action: "delete",
         id: id
        })
      })
     .then(res => res.json())
     .then(() => {
       alert("削除したよ");
       location.reload();
      })
     .catch(err => {
       alert("削除失敗 😢");
       console.error(err);
      });

    });
    
  </script>

</body>
</html>
