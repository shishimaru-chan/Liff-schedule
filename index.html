<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- LIFF SDK（※必須） -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark-blue: #1A0089;
      --orange: #FF5E33;
      --cream: #EFE7D3;
      --green: #B7CF4F;
      --gray: #999;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--dark-blue);
    }

    h2 {
      font-size: 14px;
      margin: 24px 0 8px;
    }

    .calendar {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .weekdays,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays div {
      font-size: 11px;
      color: var(--gray);
    }

    .dates div {
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .dates .selected {
      background: var(--orange);
      color: #fff;
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--dark-blue);
      background: #fff;
      cursor: pointer;
    }

    .btn.selected {
      background: var(--green);
      border-color: var(--green);
    }

    textarea {
      width: 100%;
      border-radius: 14px;
      border: none;
      padding: 12px;
    }

    .submit {
      margin-top: 28px;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: none;
      background: var(--dark-blue);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="calendar">
  <div class="calendar-header">
    <button id="prevMonth">◀</button>
    <span id="currentMonth"></span>
    <button id="nextMonth">▶</button>
  </div>

  <div class="weekdays">
    <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
  </div>

  <div class="dates" id="calendarDays"></div>
</div>

<h2>時間</h2>
<div class="button-group time-group">
  <div class="btn selected">昼</div>
  <div class="btn">夜</div>
  <div class="btn">1日</div>
</div>

<h2>カテゴリ</h2>
<div class="button-group category-group">
  <div class="btn selected">友達</div>
  <div class="btn">仕事</div>
  <div class="btn">デート</div>
</div>

<h2>メモ</h2>
<textarea rows="3"></textarea>

<button class="submit" id="submitBtn">登録する</button>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxxBytl1C5bqEbwQqEMSwid2h2KTfhiHPjC5gzbrAbBnOeUIu1IWiSqXo0-k8zL5d95NA/exec";

  let selectedDate = null;
  let currentDate = new Date();
  let myProfile = null;

  // ===== LIFF 初期化 =====
  window.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: "2008794909-gcaJmGXJ" });
    myProfile = await liff.getProfile();

    // ★ USER_ID確認用（確認できたら消す）
    alert("USER_ID:\n" + myProfile.userId);

    renderCalendar();
  });

  // ===== カレンダー =====
  const monthLabel = document.getElementById("currentMonth");
  const calendarDays = document.getElementById("calendarDays");

  function renderCalendar() {
    calendarDays.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthLabel.textContent = `${year}年${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      calendarDays.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= lastDate; day++) {
      const d = document.createElement("div");
      d.textContent = day;

      d.onclick = () => {
        document.querySelectorAll(".dates div").forEach(el => el.classList.remove("selected"));
        d.classList.add("selected");
        selectedDate = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      };

      calendarDays.appendChild(d);
    }
  }

  document.getElementById("prevMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  };

  document.getElementById("nextMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  };

  // ===== 登録 =====
  document.getElementById("submitBtn").onclick = async () => {
    if (!selectedDate) {
      alert("日付を選んでね");
      return;
    }

    let owner = "";
    if (myProfile.userId === "舞ちゃんのUSER_ID") {
      owner = "mai";
    } else if (myProfile.userId === "彼氏のUSER_ID") {
      owner = "takuya";
    } else {
      alert("登録者が判別できません");
      return;
    }

    const time = [...document.querySelectorAll(".time-group .btn.selected")].map(b => b.textContent).join(",");
    const category = document.querySelector(".category-group .btn.selected")?.textContent || "";
    const memo = document.querySelector("textarea").value;

    const payload = { date: selectedDate, owner, time, category, memo };

    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    if (result.result === "ok") {
      alert("登録できたよ！");
      liff.closeWindow();
    } else {
      alert("登録失敗");
    }
  };
</script>

</body>
</html>
