<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>予定登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --dark-blue: #1A0089;
      --orange: #FF5E33;
      --cream: #EFE7D3;
      --green: #B7CF4F;
    }

    body {
      font-family: "Noto Sans JP", sans-serif;
      background: var(--cream);
      color: var(--dark-blue);
      margin: 0;
      padding: 16px;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 15px;
      font-weight: 600;
    }

    /* ===== カレンダー ===== */
    .calendar {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .calendar-header span {
      cursor: pointer;
    }

    .weekdays,
    .dates {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays div {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .dates div {
      padding: 6px 0;
      border-radius: 8px;
      font-size: 14px;
    }

    .dates .selected {
      background: var(--orange);
      color: #fff;
    }

    .dates .today {
      background: var(--green);
    }

    /* ===== ボタン共通 ===== */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--dark-blue);
      background: #fff;
      font-size: 13px;
    }

    .btn.selected {
      background: var(--green);
      border-color: var(--green);
    }

    /* ===== ラジオ ===== */
    .radio-group label {
      margin-right: 16px;
      font-size: 14px;
    }

    /* ===== メモ ===== */
    textarea {
      width: 100%;
      border-radius: 12px;
      border: none;
      padding: 10px;
      font-size: 14px;
      resize: none;
    }

    /* ===== 登録ボタン ===== */
    .submit {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: var(--orange);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- カレンダー -->
  <div class="calendar">
    <div class="calendar-header">
      <span>◀</span>
      <div>2025年1月</div>
      <span>▶︎</span>
    </div>

    <div class="weekdays">
      <div>日</div><div>月</div><div>火</div><div>水</div>
      <div>木</div><div>金</div><div>土</div>
    </div>

    <div class="dates">
      <div></div><div></div>
      <div>1</div><div>2</div><div>3</div><div>4</div>
      <div>5</div><div class="today">6</div>
      <div class="selected">7</div><div>8</div><div>9</div><div>10</div>
    </div>
  </div>

  <!-- 予定タイプ -->
  <h2>予定の種類</h2>
  <div class="radio-group">
    <label><input type="radio" checked> 2人の予定</label>
    <label><input type="radio"> 自分の予定</label>
  </div>

  <!-- 時間 -->
  <h2>時間</h2>
  <div class="button-group">
    <div class="btn">朝</div>
    <div class="btn selected">昼</div>
    <div class="btn">夕</div>
    <div class="btn">夜</div>
    <div class="btn">1日</div>
  </div>

  <!-- カテゴリ -->
  <h2>カテゴリ</h2>
  <div class="button-group">
    <div class="btn selected">友達</div>
    <div class="btn">Create</div>
    <div class="btn">Mainte</div>
    <div class="btn">仕事</div>
    <div class="btn">デート</div>
    <div class="btn">家族</div>
  </div>

  <!-- メモ -->
  <h2>メモ</h2>
  <textarea rows="3" placeholder="メモを入力（100文字以内）"></textarea>

  <!-- 登録 -->
  <button class="submit">登録する</button>

  <script>
  // ▼▼▼ ここにGASのURLを貼る ▼▼▼

</script>


</body>
</html>
